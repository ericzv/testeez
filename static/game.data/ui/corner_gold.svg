<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" width="60" height="60">
  <defs>
    <!-- Gradiente dourado principal -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="30%" style="stop-color:#FFF8DC"/>
      <stop offset="50%" style="stop-color:#FFD700"/>
      <stop offset="70%" style="stop-color:#B8860B"/>
      <stop offset="100%" style="stop-color:#8B6914"/>
    </linearGradient>

    <!-- Gradiente de sombra -->
    <linearGradient id="shadowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5C4A1F"/>
      <stop offset="100%" style="stop-color:#3A2F12"/>
    </linearGradient>

    <!-- Brilho -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Sombra do ornamento -->
  <path d="M 5 60
           L 5 45
           C 5 35, 10 25, 20 20
           L 35 12
           C 42 8, 48 5, 60 5
           L 60 8
           C 50 8, 44 11, 38 14
           L 23 22
           C 14 27, 8 36, 8 45
           L 8 60 Z"
        fill="url(#shadowGrad)" opacity="0.6"/>

  <!-- Ornamento principal -->
  <path d="M 2 60
           L 2 42
           C 2 32, 8 22, 18 16
           L 34 8
           C 42 4, 50 2, 60 2
           L 60 5
           C 52 5, 44 7, 36 11
           L 20 19
           C 11 25, 5 34, 5 42
           L 5 60 Z"
        fill="url(#goldGrad)" filter="url(#glow)"/>

  <!-- Detalhe ornamental interno - voluta -->
  <path d="M 8 55
           Q 8 40, 15 32
           Q 22 24, 32 20
           Q 28 26, 20 32
           Q 12 38, 12 50
           Z"
        fill="url(#goldGrad)" opacity="0.7"/>

  <!-- Detalhe de flor/roseta no canto -->
  <circle cx="15" cy="45" r="4" fill="url(#goldGrad)" filter="url(#glow)"/>
  <circle cx="15" cy="45" r="2" fill="#FFF8DC" opacity="0.8"/>

  <!-- Pequenos pontos decorativos -->
  <circle cx="25" cy="35" r="1.5" fill="#FFD700"/>
  <circle cx="35" cy="25" r="1.5" fill="#FFD700"/>
  <circle cx="45" cy="15" r="1.5" fill="#FFD700"/>

  <!-- Linha de brilho -->
  <path d="M 4 50 Q 10 35, 25 25 Q 40 15, 55 5"
        stroke="#FFF8DC" stroke-width="0.5" fill="none" opacity="0.6"/>
</svg>
