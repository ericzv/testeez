<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="magicGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E90FF"/>
      <stop offset="50%" style="stop-color:#00BFFF"/>
      <stop offset="100%" style="stop-color:#4169E1"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#B0E0FF"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Aura externa -->
  <circle cx="32" cy="32" r="24" fill="none" stroke="url(#magicGrad)" stroke-width="2" opacity="0.3"/>
  <circle cx="32" cy="32" r="20" fill="none" stroke="url(#magicGrad)" stroke-width="1.5" opacity="0.5"/>

  <!-- Estrela central -->
  <path d="M 32 8 L 36 24 L 52 24 L 40 34 L 44 50 L 32 40 L 20 50 L 24 34 L 12 24 L 28 24 Z"
        fill="url(#magicGrad)" filter="url(#glow)"/>

  <!-- Núcleo brilhante -->
  <circle cx="32" cy="30" r="6" fill="url(#coreGrad)" filter="url(#glow)"/>

  <!-- Partículas mágicas azuis -->
  <circle cx="18" cy="18" r="2" fill="#00BFFF" opacity="0.8"/>
  <circle cx="46" cy="16" r="1.5" fill="#87CEEB" opacity="0.7"/>
  <circle cx="50" cy="40" r="2" fill="#00BFFF" opacity="0.6"/>
  <circle cx="14" cy="44" r="1.5" fill="#87CEEB" opacity="0.7"/>
  <circle cx="40" cy="52" r="1" fill="#00BFFF" opacity="0.5"/>
  <circle cx="24" cy="54" r="1.5" fill="#87CEEB" opacity="0.6"/>
</svg>
