<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00BFFF"/>
      <stop offset="50%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#1E90FF"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#87CEEB"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Estrela de 4 pontas principal (sparkle) -->
  <path d="M 32 4 Q 34 28 32 32 Q 30 28 32 4
           M 60 32 Q 36 34 32 32 Q 36 30 60 32
           M 32 60 Q 30 36 32 32 Q 34 36 32 60
           M 4 32 Q 28 30 32 32 Q 28 34 4 32"
        fill="url(#sparkleGrad)" filter="url(#softGlow)"/>

  <!-- Pontas secundárias menores (diagonal) -->
  <path d="M 12 12 Q 30 30 32 32 Q 30 30 12 12
           M 52 12 Q 34 30 32 32 Q 34 30 52 12
           M 52 52 Q 34 34 32 32 Q 34 34 52 52
           M 12 52 Q 30 34 32 32 Q 30 34 12 52"
        fill="#00BFFF" opacity="0.6" filter="url(#glow)"/>

  <!-- Núcleo central brilhante -->
  <circle cx="32" cy="32" r="6" fill="url(#coreGrad)" filter="url(#glow)"/>

  <!-- Brilho interno -->
  <circle cx="32" cy="32" r="3" fill="#FFFFFF" opacity="0.9"/>
</svg>
