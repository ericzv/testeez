<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#C0C0C0"/>
      <stop offset="50%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#A0A0A0"/>
    </linearGradient>
    <linearGradient id="handleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#654321"/>
      <stop offset="100%" style="stop-color:#3D2914"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Lâmina principal - espada vertical apontando para cima -->
  <path d="M 32 6 L 38 18 L 36 42 L 32 46 L 28 42 L 26 18 Z"
        fill="url(#bladeGrad)" stroke="#888" stroke-width="1" filter="url(#glow)"/>

  <!-- Brilho central da lâmina -->
  <path d="M 32 8 L 34 18 L 33 40 L 32 42 L 31 40 L 30 18 Z"
        fill="rgba(255,255,255,0.6)"/>

  <!-- Guarda da espada (horizontal) -->
  <rect x="20" y="44" width="24" height="5" rx="2"
        fill="#4A3728" stroke="#2D1A0C" stroke-width="1"/>

  <!-- Detalhe dourado na guarda -->
  <rect x="22" y="45.5" width="20" height="2" rx="1" fill="#DAA520"/>

  <!-- Cabo -->
  <rect x="29" y="49" width="6" height="10" rx="1"
        fill="url(#handleGrad)" stroke="#2D1A0C" stroke-width="0.5"/>

  <!-- Pomo (base do cabo) -->
  <circle cx="32" cy="60" r="3" fill="#DAA520" stroke="#B8860B" stroke-width="1"/>
</svg>
