<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enemy Template Generator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            padding: 20px;
        }

        .header {
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
            margin-bottom: 30px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        .generator-panel {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
        }

        .enemy-preview {
            background: rgba(0, 0, 0, 0.3);
            border: 3px solid rgba(255, 215, 0, 0.3);
            border-radius: 15px;
            padding: 20px;
            min-height: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .sprite-container {
            position: relative;
            width: 256px;
            height: 256px;
            margin: 20px 0;
        }

        .sprite-layer {
            position: absolute;
            width: 128px;
            height: 128px;
            image-rendering: pixelated;
            transform: scale(2);
            transform-origin: top left;
        }

        .rarity-badge {
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 1rem;
            margin: 10px 0;
        }

        .rarity-1 { background: #6c757d; }
        .rarity-2 { background: #17a2b8; }
        .rarity-3 { background: #6f42c1; }
        .rarity-4 { background: #fd7e14; }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin: 20px 0;
            width: 100%;
        }

        .stat-box {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-label {
            font-size: 0.9rem;
            color: #aaa;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: #ffd700;
        }

        .form-control, .form-select, textarea {
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(255, 215, 0, 0.3);
            color: #fff;
            padding: 10px;
        }

        .form-control:focus, .form-select:focus, textarea:focus {
            background: rgba(0, 0, 0, 0.7);
            border-color: #ffd700;
            color: #fff;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
        }

        .form-control::placeholder {
            color: #888;
        }

        .form-select option {
            background: #1a1a2e;
            color: #fff;
        }

        .btn-generate {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 25px;
            transition: all 0.3s ease;
        }

        .btn-generate:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.5);
        }

        .btn-save {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            border: none;
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 25px;
        }

        .btn-save:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(17, 153, 142, 0.5);
        }

        .templates-list {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
        }

        .template-card {
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            transition: all 0.2s ease;
        }

        .template-card:hover {
            border-color: #ffd700;
            transform: translateX(5px);
        }

        .seed-display {
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 15px;
            border-radius: 8px;
            font-family: monospace;
            color: #ffd700;
            border: 1px solid rgba(255, 215, 0, 0.3);
            display: inline-block;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="header">
            <h1 class="text-center"><i class="fas fa-robot"></i> Enemy Template Generator</h1>
            <p class="text-center mb-0">Gere inimigos proceduralmente e salve os melhores como templates</p>
        </div>

        <div class="row">
            <!-- Gerador -->
            <div class="col-lg-8">
                <div class="generator-panel">
                    <h3 class="mb-4"><i class="fas fa-dice"></i> Gerador de Inimigos</h3>

                    <div class="row mb-3">
                        <div class="col-md-4">
                            <label class="form-label">Tema</label>
                            <select class="form-select" id="theme-select">
                                <option value="1">Guerreiro Azul</option>
                                <option value="2">Guerreiros Grandes</option>
                                <option value="3">Guerreiros Pouca Roupa</option>
                                <option value="4">Guerreiro Dark</option>
                                <option value="5">Guerreiros Coloridos</option>
                                <option value="6">Ninjas e Samurais</option>
                                <option value="7">Mages</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Enemy Number (1-100)</label>
                            <input type="number" class="form-control" id="enemy-number" value="25" min="1" max="100">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Seed (opcional)</label>
                            <input type="number" class="form-control" id="seed-input" placeholder="Aleatório">
                        </div>
                    </div>

                    <div class="text-center mb-4">
                        <button class="btn btn-generate btn-lg" onclick="generateEnemy()">
                            <i class="fas fa-sync-alt"></i> Gerar Inimigo
                        </button>
                    </div>

                    <!-- Preview do Inimigo -->
                    <div class="enemy-preview" id="enemy-preview">
                        <i class="fas fa-ghost" style="font-size: 4rem; color: #555;"></i>
                        <p class="mt-3" style="color: #888;">Clique em "Gerar Inimigo" para começar</p>
                    </div>

                    <!-- Campos Editáveis -->
                    <div id="edit-fields" style="display: none;">
                        <h4 class="mt-4 mb-3">Editar Template</h4>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Nome</label>
                                <input type="text" class="form-control" id="enemy-name">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Behavior Pattern</label>
                                <select class="form-select" id="behavior-pattern">
                                    <option value="default">Padrão</option>
                                    <option value="aggressive">Agressivo</option>
                                    <option value="defensive">Defensivo</option>
                                    <option value="burst">Burst</option>
                                    <option value="support">Suporte</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Fala Típica</label>
                            <textarea class="form-control" id="typical-phrase" rows="2" placeholder="Ex: 'Você não passará!'"></textarea>
                        </div>

                        <div class="text-center">
                            <button class="btn btn-save btn-lg" onclick="saveTemplate()">
                                <i class="fas fa-save"></i> Salvar como Template
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Templates Salvos -->
            <div class="col-lg-4">
                <div class="templates-list">
                    <h3 class="mb-4"><i class="fas fa-bookmark"></i> Templates Salvos</h3>
                    <div id="templates-container">
                        <p class="text-center text-muted">Nenhum template salvo ainda</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        let currentEnemy = null;

        // Gerar inimigo
        async function generateEnemy() {
            const themeId = parseInt(document.getElementById('theme-select').value);
            const enemyNumber = parseInt(document.getElementById('enemy-number').value);
            const seed = document.getElementById('seed-input').value || null;

            try {
                const response = await fetch('/gamification/generate_enemy_preview', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ theme_id: themeId, enemy_number: enemyNumber, seed })
                });

                const result = await response.json();

                if (result.success) {
                    currentEnemy = result.enemy;
                    displayEnemyPreview(currentEnemy);
                    document.getElementById('edit-fields').style.display = 'block';
                } else {
                    alert('❌ Erro ao gerar inimigo: ' + result.message);
                }
            } catch (error) {
                console.error('Erro:', error);
                alert('❌ Erro ao gerar inimigo!');
            }
        }

        // Mostrar preview do inimigo
        function displayEnemyPreview(enemy) {
            const preview = document.getElementById('enemy-preview');

            preview.innerHTML = `
                <h2>${enemy.name}</h2>
                <span class="rarity-badge rarity-${enemy.rarity}">${enemy.rarity_name}</span>
                <span class="badge bg-secondary">${enemy.equipment_rank}</span>

                <div class="sprite-container">
                    ${enemy.sprite_layers.back ? `<img src="/static/game.data/enemies/back/${enemy.sprite_layers.back}" class="sprite-layer" style="z-index: 1;">` : ''}
                    ${enemy.sprite_layers.body ? `<img src="/static/game.data/enemies/body/${enemy.sprite_layers.body}" class="sprite-layer" style="z-index: 2;">` : ''}
                    ${enemy.sprite_layers.head ? `<img src="/static/game.data/enemies/head/${enemy.sprite_layers.head}" class="sprite-layer" style="z-index: 3;">` : ''}
                    ${enemy.sprite_layers.weapon ? `<img src="/static/game.data/enemies/weapon/${enemy.sprite_layers.weapon}" class="sprite-layer" style="z-index: 4;">` : ''}
                </div>

                <div class="stats-grid">
                    <div class="stat-box">
                        <div class="stat-label">HP</div>
                        <div class="stat-value">${enemy.hp}</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-label">Dano</div>
                        <div class="stat-value">${enemy.damage}</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-label">Defesa</div>
                        <div class="stat-value">${enemy.block_percentage}%</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-label">Raridade</div>
                        <div class="stat-value">${enemy.rarity}</div>
                    </div>
                </div>

                <div class="seed-display">
                    <i class="fas fa-fingerprint"></i> Seed: ${enemy.seed}
                </div>
            `;

            // Preencher campos editáveis
            document.getElementById('enemy-name').value = enemy.name;
            document.getElementById('typical-phrase').value = enemy.typical_phrase || '';
            document.getElementById('behavior-pattern').value = enemy.behavior_pattern || 'default';
        }

        // Salvar template
        async function saveTemplate() {
            if (!currentEnemy) {
                alert('Gere um inimigo primeiro!');
                return;
            }

            const templateData = {
                ...currentEnemy,
                name: document.getElementById('enemy-name').value,
                typical_phrase: document.getElementById('typical-phrase').value,
                behavior_pattern: document.getElementById('behavior-pattern').value
            };

            try {
                const response = await fetch('/gamification/save_enemy_template', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(templateData)
                });

                const result = await response.json();

                if (result.success) {
                    alert('✅ Template salvo com sucesso!');
                    loadTemplates();
                } else {
                    alert('❌ Erro ao salvar: ' + result.message);
                }
            } catch (error) {
                console.error('Erro:', error);
                alert('❌ Erro ao salvar template!');
            }
        }

        // Carregar templates salvos
        async function loadTemplates() {
            try {
                const response = await fetch('/gamification/get_enemy_templates');
                const data = await response.json();

                const container = document.getElementById('templates-container');

                if (!data.templates || data.templates.length === 0) {
                    container.innerHTML = '<p class="text-center text-muted">Nenhum template salvo ainda</p>';
                    return;
                }

                container.innerHTML = data.templates.map(t => `
                    <div class="template-card">
                        <div class="d-flex justify-content-between align-items-start">
                            <div>
                                <h5>${t.name}</h5>
                                <span class="rarity-badge rarity-${t.rarity}">${t.rarity_name}</span>
                                <p class="mb-1 mt-2"><small>HP: ${t.hp} | DMG: ${t.damage} | DEF: ${t.block_percentage}%</small></p>
                                ${t.typical_phrase ? `<p class="mb-1"><em>"${t.typical_phrase}"</em></p>` : ''}
                                <p class="mb-0"><small class="text-muted">Seed: ${t.seed}</small></p>
                            </div>
                            <button class="btn btn-sm btn-danger" onclick="deleteTemplate(${t.id})">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Erro ao carregar templates:', error);
            }
        }

        // Deletar template
        async function deleteTemplate(id) {
            if (!confirm('Tem certeza que deseja deletar este template?')) return;

            try {
                const response = await fetch(`/gamification/delete_enemy_template/${id}`, {
                    method: 'DELETE'
                });

                const result = await response.json();

                if (result.success) {
                    loadTemplates();
                } else {
                    alert('❌ Erro ao deletar');
                }
            } catch (error) {
                console.error('Erro:', error);
            }
        }

        // Carregar templates ao iniciar
        window.addEventListener('DOMContentLoaded', loadTemplates);
    </script>
</body>
</html>
