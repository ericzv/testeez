<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enemy Template Generator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            padding: 20px;
        }

        .header {
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
            margin-bottom: 30px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        .generator-panel {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
        }

        .enemy-preview {
            background: rgba(0, 0, 0, 0.3);
            border: 3px solid rgba(255, 215, 0, 0.3);
            border-radius: 15px;
            padding: 15px;
            min-height: 300px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .sprite-container {
            position: relative;
            width: 256px;
            height: 256px;
            margin: 10px 0;
            scale: 2;
            right: -10%;
        }

        .sprite-layer {
            position: absolute;
            width: 64px;
            height: 64px;
            image-rendering: pixelated;
            transform: scale(2);
            transform-origin: top left;
            background-size: auto 64px;
            animation: sprite-animation 0.8s steps(11) infinite;
        }

        @keyframes sprite-animation {
            from { background-position: 0 0; }
            to { background-position: -704px 0; }
        }

        .rarity-badge {
            padding: 5px 15px;
            border-radius: 15px;
            font-weight: bold;
            font-size: 0.85rem;
            margin: 5px 0;
        }

        .rarity-1 { background: #6c757d; }
        .rarity-2 { background: #17a2b8; }
        .rarity-3 { background: #6f42c1; }
        .rarity-4 { background: #fd7e14; }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin: 10px 0;
            width: 100%;
        }

        .stat-box {
            background: rgba(255, 255, 255, 0.1);
            padding: 8px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-label {
            font-size: 0.75rem;
            color: #aaa;
            margin-bottom: 3px;
        }

        .stat-value {
            font-size: 1.1rem;
            font-weight: bold;
            color: #ffd700;
        }

        .seed-display {
            font-size: 0.75rem;
            color: #888;
            margin-top: 5px;
        }

        .enemy-preview h2 {
            font-size: 1.3rem;
            margin: 5px 0;
        }

        .form-control, .form-select, textarea {
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(255, 215, 0, 0.3);
            color: #fff;
            padding: 10px;
        }

        .form-control:focus, .form-select:focus, textarea:focus {
            background: rgba(0, 0, 0, 0.7);
            border-color: #ffd700;
            color: #fff;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
        }

        .form-control::placeholder {
            color: #888;
        }

        .form-select option {
            background: #1a1a2e;
            color: #fff;
        }

        .btn-generate {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 25px;
            transition: all 0.3s ease;
        }

        .btn-generate:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.5);
        }

        .btn-save {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            border: none;
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 25px;
        }

        .btn-save:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(17, 153, 142, 0.5);
        }

        .templates-list {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
        }

        .template-card {
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            transition: all 0.2s ease;
        }

        .template-card:hover {
            border-color: #ffd700;
            transform: translateX(5px);
        }

        .seed-display {
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 15px;
            border-radius: 8px;
            font-family: monospace;
            color: #ffd700;
            border: 1px solid rgba(255, 215, 0, 0.3);
            display: inline-block;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <!-- Gerador -->
        <div class="generator-panel">
            <h3 class="mb-4"><i class="fas fa-dice"></i> Enemy Template Generator</h3>

            <div class="row mb-3">
                <div class="col-md-4">
                    <label class="form-label">Tema</label>
                    <select class="form-select" id="theme-select">
                        <option value="">Carregando...</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Enemy Number (1-100)</label>
                    <input type="number" class="form-control" id="enemy-number" value="25" min="1" max="100">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Seed (opcional)</label>
                    <input type="number" class="form-control" id="seed-input" placeholder="Aleatório">
                </div>
            </div>

            <div class="text-center mb-4">
                <button class="btn btn-generate btn-lg" onclick="generateEnemy()">
                    <i class="fas fa-sync-alt"></i> Gerar Inimigo
                </button>
            </div>

            <!-- Preview e Campos Editáveis lado a lado -->
            <div class="row">
                <div class="col-md-6">
                    <!-- Preview do Inimigo -->
                    <div class="enemy-preview" id="enemy-preview">
                        <i class="fas fa-ghost" style="font-size: 4rem; color: #555;"></i>
                        <p class="mt-3" style="color: #888;">Clique em "Gerar Inimigo" para começar</p>
                    </div>
                </div>

                <div class="col-md-6">
                    <!-- Campos Editáveis -->
                    <div id="edit-fields" style="display: none;">
                        <h4 class="mb-3">Editar Template</h4>

                        <div class="mb-3">
                            <label class="form-label">Nome</label>
                            <input type="text" class="form-control" id="enemy-name">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Behavior Pattern</label>
                            <select class="form-select" id="behavior-pattern">
                                <option value="default">Padrão</option>
                                <option value="aggressive">Agressivo</option>
                                <option value="defensive">Defensivo</option>
                                <option value="burst">Burst</option>
                                <option value="support">Suporte</option>
                            </select>
                        </div>

                        <!-- Equipamentos Editáveis -->
                        <h5 class="mt-3 mb-2"><i class="fas fa-tshirt"></i> Equipamentos</h5>
                        <div class="row mb-2">
                            <div class="col-6">
                                <label class="form-label">Body</label>
                                <select class="form-select" id="equipment-body"></select>
                            </div>
                            <div class="col-6">
                                <label class="form-label">Head</label>
                                <select class="form-select" id="equipment-head"></select>
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-6">
                                <label class="form-label">Weapon</label>
                                <select class="form-select" id="equipment-weapon"></select>
                            </div>
                            <div class="col-6">
                                <label class="form-label">Back</label>
                                <select class="form-select" id="equipment-back">
                                    <option value="">Nenhum</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Fala Típica</label>
                            <textarea class="form-control" id="typical-phrase" rows="2" placeholder="Ex: 'Você não passará!'"></textarea>
                        </div>

                        <div class="text-center">
                            <button class="btn btn-save btn-lg" onclick="saveTemplate()">
                                <i class="fas fa-save"></i> Salvar Template
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Templates Salvos (embaixo) -->
        <div class="templates-list mt-4">
            <h3 class="mb-4"><i class="fas fa-bookmark"></i> Templates Salvos</h3>
            <div id="templates-container">
                <p class="text-center text-muted">Nenhum template salvo ainda</p>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        let currentEnemy = null;
        let equipmentTierMap = {}; // Mapeamento de equipamento → tier

        // Carregar temas ao iniciar
        async function loadThemes() {
            try {
                const response = await fetch('/gamification/get_themes');
                const result = await response.json();

                const select = document.getElementById('theme-select');
                select.innerHTML = '';

                result.themes.forEach((theme, index) => {
                    const option = document.createElement('option');
                    option.value = theme.name;
                    option.textContent = theme.name;
                    select.appendChild(option);
                });
            } catch (error) {
                console.error('Erro ao carregar temas:', error);
                alert('Erro ao carregar temas!');
            }
        }

        // Gerar inimigo
        async function generateEnemy() {
            const themeName = document.getElementById('theme-select').value;
            const enemyNumber = parseInt(document.getElementById('enemy-number').value);
            const seed = document.getElementById('seed-input').value || null;

            try {
                const response = await fetch('/gamification/generate_enemy_preview', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ theme_name: themeName, enemy_number: enemyNumber, seed })
                });

                const result = await response.json();

                if (result.success) {
                    currentEnemy = result.enemy;
                    displayEnemyPreview(currentEnemy);
                    document.getElementById('edit-fields').style.display = 'block';
                } else {
                    alert('❌ Erro ao gerar inimigo: ' + result.message);
                }
            } catch (error) {
                console.error('Erro:', error);
                alert('❌ Erro ao gerar inimigo!');
            }
        }

        // Mostrar preview do inimigo
        async function displayEnemyPreview(enemy) {
            const preview = document.getElementById('enemy-preview');

            preview.innerHTML = `
                <h2>${enemy.name}</h2>
                <span class="rarity-badge rarity-${enemy.rarity}">${enemy.rarity_name}</span>

                <div class="sprite-container">
                    ${enemy.sprite_layers.back ? `<div class="sprite-layer" style="z-index: 1; background-image: url('/static/game.data/enemies/back/${enemy.sprite_layers.back}');"></div>` : ''}
                    ${enemy.sprite_layers.body ? `<div class="sprite-layer" style="z-index: 2; background-image: url('/static/game.data/enemies/body/${enemy.sprite_layers.body}');"></div>` : ''}
                    ${enemy.sprite_layers.head ? `<div class="sprite-layer" style="z-index: 3; background-image: url('/static/game.data/enemies/head/${enemy.sprite_layers.head}');"></div>` : ''}
                    ${enemy.sprite_layers.weapon ? `<div class="sprite-layer" style="z-index: 4; background-image: url('/static/game.data/enemies/weapon/${enemy.sprite_layers.weapon}');"></div>` : ''}
                </div>

                <div class="stats-grid">
                    <div class="stat-box">
                        <div class="stat-label">HP Tier</div>
                        <div class="stat-value">${enemy.hp_tier}</div>
                        <div class="stat-label" style="font-size: 0.65rem;">(${enemy.equipment_tiers.body} + ${enemy.equipment_tiers.head} + ${enemy.equipment_tiers.back})</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-label">Damage Tier</div>
                        <div class="stat-value">${enemy.damage_tier}</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-label">Raridade</div>
                        <div class="stat-value">${enemy.rarity_name}</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-label">Body</div>
                        <div class="stat-value">Tier ${enemy.equipment_tiers.body}</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-label">Head</div>
                        <div class="stat-value">Tier ${enemy.equipment_tiers.head}</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-label">Weapon</div>
                        <div class="stat-value">Tier ${enemy.equipment_tiers.weapon}</div>
                    </div>
                </div>

                <div class="seed-display">
                    <i class="fas fa-fingerprint"></i> Seed: ${enemy.seed}
                </div>
            `;

            // Preencher campos editáveis
            document.getElementById('enemy-name').value = enemy.name;
            document.getElementById('typical-phrase').value = enemy.typical_phrase || '';
            document.getElementById('behavior-pattern').value = enemy.behavior_pattern || 'default';

            // Carregar equipamentos disponíveis do tema e popular selects
            await loadEquipmentOptions(enemy.theme_name || document.getElementById('theme-select').value);

            // Selecionar equipamentos atuais
            document.getElementById('equipment-body').value = enemy.sprite_layers.body;
            document.getElementById('equipment-head').value = enemy.sprite_layers.head;
            document.getElementById('equipment-weapon').value = enemy.sprite_layers.weapon;
            document.getElementById('equipment-back').value = enemy.sprite_layers.back || '';
        }

        // Carregar opções de equipamentos do tema
        async function loadEquipmentOptions(themeName) {
            try {
                const response = await fetch(`/gamification/get_theme_equipment?theme=${encodeURIComponent(themeName)}`);
                const data = await response.json();

                // Armazenar mapeamento de tiers
                equipmentTierMap = data.equipment_tiers || {};

                // Popular selects
                ['body', 'head', 'weapon', 'back'].forEach(type => {
                    const select = document.getElementById(`equipment-${type}`);
                    select.innerHTML = type === 'back' ? '<option value="">Nenhum</option>' : '';

                    (data[`${type}_options`] || []).forEach(option => {
                        const opt = document.createElement('option');
                        opt.value = option;
                        opt.textContent = option;
                        select.appendChild(opt);
                    });

                    // Atualizar preview quando trocar
                    select.onchange = updatePreviewSprite;
                });
            } catch (error) {
                console.error('Erro ao carregar equipamentos:', error);
            }
        }

        // Atualizar sprite no preview ao trocar equipamento
        function updatePreviewSprite() {
            if (!currentEnemy) return;

            // Atualizar dados do inimigo atual
            currentEnemy.sprite_layers.body = document.getElementById('equipment-body').value;
            currentEnemy.sprite_layers.head = document.getElementById('equipment-head').value;
            currentEnemy.sprite_layers.weapon = document.getElementById('equipment-weapon').value;
            currentEnemy.sprite_layers.back = document.getElementById('equipment-back').value;

            // Recalcular tiers dos equipamentos
            const bodyTier = equipmentTierMap[currentEnemy.sprite_layers.body] || 1;
            const headTier = equipmentTierMap[currentEnemy.sprite_layers.head] || 1;
            const weaponTier = equipmentTierMap[currentEnemy.sprite_layers.weapon] || 1;
            const backTier = currentEnemy.sprite_layers.back ? (equipmentTierMap[currentEnemy.sprite_layers.back] || 0) : 0;

            // Atualizar tiers no objeto do inimigo
            currentEnemy.equipment_tiers = {
                body: bodyTier,
                head: headTier,
                weapon: weaponTier,
                back: backTier
            };
            currentEnemy.hp_tier = bodyTier + headTier + backTier;
            currentEnemy.damage_tier = weaponTier;

            // Recarregar preview (sem recarregar selects)
            const preview = document.getElementById('enemy-preview');
            const spriteContainer = preview.querySelector('.sprite-container');
            const statsGrid = preview.querySelector('.stats-grid');

            // Atualizar sprite
            spriteContainer.innerHTML = `
                ${currentEnemy.sprite_layers.back ? `<div class="sprite-layer" style="z-index: 1; background-image: url('/static/game.data/enemies/back/${currentEnemy.sprite_layers.back}');"></div>` : ''}
                ${currentEnemy.sprite_layers.body ? `<div class="sprite-layer" style="z-index: 2; background-image: url('/static/game.data/enemies/body/${currentEnemy.sprite_layers.body}');"></div>` : ''}
                ${currentEnemy.sprite_layers.head ? `<div class="sprite-layer" style="z-index: 3; background-image: url('/static/game.data/enemies/head/${currentEnemy.sprite_layers.head}');"></div>` : ''}
                ${currentEnemy.sprite_layers.weapon ? `<div class="sprite-layer" style="z-index: 4; background-image: url('/static/game.data/enemies/weapon/${currentEnemy.sprite_layers.weapon}');"></div>` : ''}
            `;

            // Atualizar stats-grid com novos tiers
            statsGrid.innerHTML = `
                <div class="stat-box">
                    <div class="stat-label">HP Tier</div>
                    <div class="stat-value">${currentEnemy.hp_tier}</div>
                    <div class="stat-label" style="font-size: 0.65rem;">(${currentEnemy.equipment_tiers.body} + ${currentEnemy.equipment_tiers.head} + ${currentEnemy.equipment_tiers.back})</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Damage Tier</div>
                    <div class="stat-value">${currentEnemy.damage_tier}</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Raridade</div>
                    <div class="stat-value">${currentEnemy.rarity_name}</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Body</div>
                    <div class="stat-value">Tier ${currentEnemy.equipment_tiers.body}</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Head</div>
                    <div class="stat-value">Tier ${currentEnemy.equipment_tiers.head}</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Weapon</div>
                    <div class="stat-value">Tier ${currentEnemy.equipment_tiers.weapon}</div>
                </div>
            `;
        }

        // Salvar template
        async function saveTemplate() {
            if (!currentEnemy) {
                alert('Gere um inimigo primeiro!');
                return;
            }

            const templateData = {
                ...currentEnemy,
                name: document.getElementById('enemy-name').value,
                typical_phrase: document.getElementById('typical-phrase').value,
                behavior_pattern: document.getElementById('behavior-pattern').value
            };

            try {
                const response = await fetch('/gamification/save_enemy_template', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(templateData)
                });

                const result = await response.json();

                if (result.success) {
                    alert('✅ Template salvo com sucesso!');
                    loadTemplates();
                } else {
                    alert('❌ Erro ao salvar: ' + result.message);
                }
            } catch (error) {
                console.error('Erro:', error);
                alert('❌ Erro ao salvar template!');
            }
        }

        // Carregar templates salvos
        async function loadTemplates() {
            try {
                const response = await fetch('/gamification/get_enemy_templates');
                const data = await response.json();

                const container = document.getElementById('templates-container');

                if (!data.templates || data.templates.length === 0) {
                    container.innerHTML = '<p class="text-center text-muted">Nenhum template salvo ainda</p>';
                    return;
                }

                container.innerHTML = data.templates.map(t => `
                    <div class="template-card">
                        <div class="d-flex justify-content-between align-items-start">
                            <div>
                                <h5>${t.name}</h5>
                                <span class="rarity-badge rarity-${t.rarity}">${t.rarity_name}</span>
                                <p class="mb-1 mt-2"><small>HP Tier: ${t.hp_tier || 'N/A'} | Damage Tier: ${t.damage_tier || 'N/A'}</small></p>
                                ${t.typical_phrase ? `<p class="mb-1"><em>"${t.typical_phrase}"</em></p>` : ''}
                                <p class="mb-0"><small class="text-muted">Seed: ${t.seed}</small></p>
                            </div>
                            <div class="d-flex flex-column gap-1">
                                <button class="btn btn-sm btn-warning" onclick="editTemplate(${t.id})" title="Editar">
                                    <i class="fas fa-edit"></i>
                                </button>
                                <button class="btn btn-sm btn-danger" onclick="deleteTemplate(${t.id})" title="Deletar">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Erro ao carregar templates:', error);
            }
        }

        // Editar template existente
        async function editTemplate(id) {
            try {
                const response = await fetch('/gamification/get_enemy_templates');
                const data = await response.json();

                const template = data.templates.find(t => t.id === id);
                if (!template) {
                    alert('Template não encontrado!');
                    return;
                }

                // Carregar template como se fosse um inimigo gerado
                currentEnemy = template;
                await displayEnemyPreview(template);

                // Mostrar campos de edição
                document.getElementById('edit-fields').style.display = 'block';

                // Scroll para visualização
                document.getElementById('enemy-preview').scrollIntoView({ behavior: 'smooth' });
            } catch (error) {
                console.error('Erro ao carregar template:', error);
                alert('❌ Erro ao carregar template para edição!');
            }
        }

        // Deletar template
        async function deleteTemplate(id) {
            if (!confirm('Tem certeza que deseja deletar este template?')) return;

            try {
                const response = await fetch(`/gamification/delete_enemy_template/${id}`, {
                    method: 'DELETE'
                });

                const result = await response.json();

                if (result.success) {
                    loadTemplates();
                } else {
                    alert('❌ Erro ao deletar');
                }
            } catch (error) {
                console.error('Erro:', error);
            }
        }

        // Carregar temas e templates ao iniciar
        window.addEventListener('DOMContentLoaded', () => {
            loadThemes();
            loadTemplates();
        });
    </script>
</body>
</html>
