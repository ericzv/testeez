<!-- HUD SUPERIOR - BARRA FINA DOURADA -->
<div class="fixed-hud-top" id="fixed-hud-top">

  <!-- Seção Esquerda: Mini-icon + Nome + Ato -->
  <div class="hud-section-left">
    <!-- Mini ícone do personagem -->
    <div class="hud-character-mini">
      <img src="{{ url_for('static', filename='game.data/character/' ~ (player.character_id or 'vlad') ~ '/' ~ (player.character_id or 'vlad') ~ '-mini-icon.png') }}"
           alt="{{ player.character_name or 'Personagem' }}"
           onerror="this.src='{{ url_for('static', filename='game.data/icons/default_character.svg') }}'">
    </div>

    <!-- Nome do personagem -->
    <span class="hud-character-name">{{ player.character_name or player.character_id or 'Aventureiro' }}</span>

    <div class="hud-separator"></div>

    <!-- Info do Ato/Node -->
    <div class="hud-act-info">
      <span class="hud-act-label">Ato <span id="hud-act-number">1</span></span>
      <span class="hud-node-number">#<span id="hud-node-number">1</span></span>
    </div>
  </div>

  <!-- Slot Central: currencies-hud + relics-bar serão movidos pra cá -->
  <div class="hud-center-area">
    <div class="hud-currencies-slot" id="hud-currencies-slot">
      <!-- currencies-hud será movido aqui via JavaScript -->
    </div>

    <div class="hud-separator hud-separator-center"></div>

    <!-- Slot para Relíquias (relics-bar) - AGORA NO CENTRO -->
    <div class="hud-relics-slot" id="hud-relics-slot">
      <!-- relics-bar será movido aqui via JavaScript -->
    </div>
  </div>

  <!-- Seção Direita: Apenas Lembranças -->
  <div class="hud-section-right">
    <!-- Slot para Lembranças (run-buffs-hud) -->
    <div class="hud-memories-slot" id="hud-memories-slot">
      <div class="hud-memories-label">
        <img src="{{ url_for('static', filename='game.data/buffs/memory.png') }}" alt="Lembranças" title="Lembranças Ativas">
      </div>
      <!-- run-buffs-hud será movido aqui via JavaScript -->
    </div>
  </div>

</div>

<!-- HUD INFERIOR - 5 SEÇÕES (3 grupos: esquerda, centro, direita) -->
<div class="fixed-hud-bottom" id="fixed-hud-bottom">

  <!-- Container com 3 grupos -->
  <div class="hud-bottom-wrapper">

    <!-- GRUPO ESQUERDO (fixo à margem esquerda) -->
    <div class="hud-group-left">
      <!-- SEÇÃO 1: hud1b.png - Ícone do personagem + HP + Energia -->
      <div class="hud-bottom-section hud-section-1">
        <!-- Indicador de Energia (canto superior direito) -->
        <div class="hud-energy-indicator" id="hud-energy-indicator" data-energy-percent="high">
          <div class="hud-energy-icon-container">
            <img src="{{ url_for('static', filename='game.data/energy.png') }}" alt="Energia" class="hud-energy-icon">
          </div>
          <span class="hud-energy-text" id="hud-energy-text">10/10</span>
        </div>

        <!-- Ícone do personagem -->
        <div class="hud-player-icon">
          <img src="{{ url_for('static', filename='game.data/character/' ~ (player.character_id or 'vlad') ~ '/' ~ (player.character_id or 'vlad') ~ '-icon.png') }}"
               alt="{{ player.character_name or 'Personagem' }}"
               onerror="this.src='{{ url_for('static', filename='game.data/icons/default_character.svg') }}'">
        </div>

        <!-- Barra de HP (parte inferior) -->
        <div class="hud-hp-bar" id="hud-hp-bar-container">
          <div class="hud-barrier-fill" id="hud-barrier-fill" style="width: 0%;"></div>
          {% set hp_percent = ((player_hp or 100) / (player_max_hp or 100) * 100) | round(1) %}
          <div class="hud-hp-fill" id="hud-hp-fill" style="width: {{ hp_percent }}%;"></div>
          <span class="hud-hp-text" id="hud-hp-text">{{ player_hp or 100 }}/{{ player_max_hp or 100 }}</span>
          <!-- Display de Barreira -->
          <div class="hud-barrier-display" id="hud-barrier-display" style="display: none;">
            <svg class="hud-barrier-icon" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/>
            </svg>
            <span class="hud-barrier-value" id="hud-barrier-value">0</span>
          </div>
        </div>
      </div>

      <!-- SEÇÃO 2: hud1.png - Inventário centralizado -->
      <div class="hud-bottom-section hud-section-2">
        <!-- Slot para Inventário (centralizado) -->
        <div class="hud-inventory-slot" id="hud-inventory-slot">
          <!-- fast-inventory-wrapper será inserido aqui -->
        </div>
      </div>
    </div>

    <!-- GRUPO CENTRAL (fixo ao centro) -->
    <div class="hud-group-center">
      <!-- SEÇÃO 3: hud2.png - Reservado -->
      <div class="hud-bottom-section hud-section-3">
        <!-- Reservado -->
      </div>
    </div>

    <!-- GRUPO DIREITO (fixo à margem direita) -->
    <div class="hud-group-right">
      <!-- SEÇÃO 4: hud3.png - Reservado -->
      <div class="hud-bottom-section hud-section-4">
        <!-- Reservado para futuras funcionalidades -->
      </div>

      <!-- SEÇÃO 5: hud3a.png - Reservado -->
      <div class="hud-bottom-section hud-section-5">
        <!-- Reservado para futuras funcionalidades -->
      </div>
    </div>

  </div>

</div>

<!-- BATTLE UI - Container independente para menus de batalha -->
<div class="battle-ui-container" id="battle-ui-container">
  <!-- Slot para Ataques -->
  <div class="hud-attacks-slot" id="hud-attacks-slot">
    <!-- fast-attacks-wrapper será inserido aqui -->
  </div>

  <!-- Slot para Especiais -->
  <div class="hud-specials-slot" id="hud-specials-slot">
    <!-- fast-specials-wrapper será inserido aqui -->
  </div>
</div>

<!-- JavaScript para mover elementos existentes para o novo HUD -->
<script>
(function() {
  'use strict';

  // ========================================
  // MOVER ELEMENTOS EXISTENTES PARA O HUD
  // ========================================

  function moveElementToSlot(elementId, slotId) {
    const element = document.getElementById(elementId);
    const slot = document.getElementById(slotId);
    if (element && slot && !slot.contains(element)) {
      slot.appendChild(element);
      console.log(`[HUD] Moved #${elementId} to #${slotId}`);
    }
  }

  function moveByClass(className, slotId) {
    const element = document.querySelector('.' + className);
    const slot = document.getElementById(slotId);
    if (element && slot && !slot.contains(element)) {
      slot.appendChild(element);
      console.log(`[HUD] Moved .${className} to #${slotId}`);
    }
  }

  // Função para mover todos os elementos do HUD antigo
  function moveHudElements() {
    // Mover currencies-hud
    moveElementToSlot('currencies-hud', 'hud-currencies-slot');

    // Mover run-buffs-hud (lembranças)
    moveElementToSlot('run-buffs-hud', 'hud-memories-slot');

    // Mover relics-bar
    moveElementToSlot('relics-bar', 'hud-relics-slot');

    // Mover fast-wrappers (se existirem)
    moveByClass('fast-attacks-wrapper', 'hud-attacks-slot');
    moveByClass('fast-specials-wrapper', 'hud-specials-slot');
    moveByClass('fast-inventory-wrapper', 'hud-inventory-slot');
  }

  // Observer para detectar quando elementos são adicionados ao DOM
  const observer = new MutationObserver(function(mutations) {
    mutations.forEach(function(mutation) {
      mutation.addedNodes.forEach(function(node) {
        if (node.nodeType === 1) {
          // Verificar se é um dos elementos que precisamos mover
          if (node.id === 'currencies-hud') {
            moveElementToSlot('currencies-hud', 'hud-currencies-slot');
          }
          if (node.id === 'run-buffs-hud') {
            moveElementToSlot('run-buffs-hud', 'hud-memories-slot');
          }
          if (node.id === 'relics-bar') {
            moveElementToSlot('relics-bar', 'hud-relics-slot');
          }
          if (node.classList && node.classList.contains('fast-attacks-wrapper')) {
            moveByClass('fast-attacks-wrapper', 'hud-attacks-slot');
          }
          if (node.classList && node.classList.contains('fast-specials-wrapper')) {
            moveByClass('fast-specials-wrapper', 'hud-specials-slot');
          }
          if (node.classList && node.classList.contains('fast-inventory-wrapper')) {
            moveByClass('fast-inventory-wrapper', 'hud-inventory-slot');
          }
        }
      });
    });
  });

  observer.observe(document.body, { childList: true, subtree: true });

  // Tentar mover elementos imediatamente e após um delay
  moveHudElements();

  // Retry após delays para garantir que os elementos foram carregados
  setTimeout(moveHudElements, 100);
  setTimeout(moveHudElements, 500);
  setTimeout(moveHudElements, 1000);

  // ========================================
  // CARREGAR INFO DO ATO/NODE
  // ========================================
  async function loadActNodeInfo() {
    try {
      const response = await fetch('/map/api/current_progress');
      const data = await response.json();

      if (data.success) {
        const actEl = document.getElementById('hud-act-number');
        const nodeEl = document.getElementById('hud-node-number');

        if (actEl) actEl.textContent = data.current_act || 1;
        if (nodeEl) {
          // Cada ato tem 16 nodes (0-15), então calcular node relativo
          const nodeInAct = data.node_level !== undefined ? (data.node_level + 1) : 1;
          nodeEl.textContent = nodeInAct;
        }
      }
    } catch (error) {
      console.log('[HUD] Sem info de mapa:', error);
    }
  }

  // Carregar info do ato/node
  loadActNodeInfo();

  // Atualizar periodicamente (a cada 5 segundos)
  setInterval(loadActNodeInfo, 5000);

  // ========================================
  // INVENTÁRIO OVERLAY NO ÍCONE DO PLAYER
  // Detecta hover na parte não-transparente da imagem
  // ========================================

  function setupInventoryOverlay() {
    const section1 = document.querySelector('.hud-section-1');
    const playerIcon = document.querySelector('.hud-player-icon');
    const playerImg = playerIcon ? playerIcon.querySelector('img') : null;

    if (!section1 || !playerIcon || !playerImg) {
      console.log('[HUD] Elementos do player icon não encontrados para overlay');
      return;
    }

    // Criar container de overlay para o inventário
    let overlay = section1.querySelector('.hud-inventory-overlay');
    if (!overlay) {
      overlay = document.createElement('div');
      overlay.className = 'hud-inventory-overlay';
      section1.appendChild(overlay);
      console.log('[HUD] Overlay de inventário criado');
    }

    // Canvas oculto para detecção de pixels não-transparentes
    let hitCanvas = document.createElement('canvas');
    let hitCtx = hitCanvas.getContext('2d', { willReadFrequently: true });
    let imageLoaded = false;
    let imgNaturalWidth = 0;
    let imgNaturalHeight = 0;

    // Carregar imagem no canvas para detecção
    function loadImageForHitTest() {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = function() {
        hitCanvas.width = img.naturalWidth;
        hitCanvas.height = img.naturalHeight;
        imgNaturalWidth = img.naturalWidth;
        imgNaturalHeight = img.naturalHeight;
        hitCtx.clearRect(0, 0, hitCanvas.width, hitCanvas.height);
        hitCtx.drawImage(img, 0, 0);
        imageLoaded = true;
        console.log('[HUD] Imagem do player carregada para hit-test:', img.src);
      };
      img.onerror = function() {
        console.warn('[HUD] Erro ao carregar imagem para hit-test');
        // Fallback: usar hover simples no container
        imageLoaded = false;
      };
      img.src = playerImg.src;
    }

    // Verificar se pixel na posição é não-transparente
    function isPixelOpaque(x, y) {
      if (!imageLoaded || imgNaturalWidth === 0 || imgNaturalHeight === 0) return true; // Fallback

      try {
        const pixel = hitCtx.getImageData(x, y, 1, 1).data;
        return pixel[3] > 30; // Alpha > 30 considera como opaco
      } catch (e) {
        console.warn('[HUD] Erro ao ler pixel:', e);
        return true; // Fallback em caso de erro CORS
      }
    }

    // Converter coordenadas do mouse para coordenadas da imagem
    function getImageCoords(event) {
      const rect = playerImg.getBoundingClientRect();
      const scaleX = imgNaturalWidth / rect.width;
      const scaleY = imgNaturalHeight / rect.height;

      const x = Math.floor((event.clientX - rect.left) * scaleX);
      const y = Math.floor((event.clientY - rect.top) * scaleY);

      return { x, y };
    }

    let isOverlay = false;
    let hideTimeout = null;

    // Mostrar overlay
    function showOverlay() {
      if (hideTimeout) {
        clearTimeout(hideTimeout);
        hideTimeout = null;
      }
      if (!isOverlay) {
        overlay.classList.add('visible');
        isOverlay = true;
        console.log('[HUD] Overlay de inventário visível');
      }
    }

    // Esconder overlay com delay
    function hideOverlay() {
      if (hideTimeout) return;
      hideTimeout = setTimeout(() => {
        overlay.classList.remove('visible');
        isOverlay = false;
        hideTimeout = null;
      }, 300); // Delay para permitir transição suave
    }

    // Event listeners no player icon
    playerIcon.addEventListener('mousemove', function(e) {
      const coords = getImageCoords(e);
      if (coords.x >= 0 && coords.x < imgNaturalWidth && coords.y >= 0 && coords.y < imgNaturalHeight) {
        if (isPixelOpaque(coords.x, coords.y)) {
          showOverlay();
        } else {
          hideOverlay();
        }
      } else {
        hideOverlay();
      }
    });

    playerIcon.addEventListener('mouseleave', function() {
      hideOverlay();
    });

    // Manter overlay visível enquanto hover no próprio overlay
    overlay.addEventListener('mouseenter', function() {
      showOverlay();
    });

    overlay.addEventListener('mouseleave', function() {
      hideOverlay();
    });

    // Carregar imagem para hit-test
    if (playerImg.complete && playerImg.naturalWidth > 0) {
      loadImageForHitTest();
    } else {
      playerImg.addEventListener('load', loadImageForHitTest);
    }

    // Re-carregar se a imagem mudar (ex: troca de personagem)
    const imgObserver = new MutationObserver(function(mutations) {
      mutations.forEach(function(mutation) {
        if (mutation.type === 'attributes' && mutation.attributeName === 'src') {
          loadImageForHitTest();
        }
      });
    });
    imgObserver.observe(playerImg, { attributes: true });
  }

  // Mover inventário para o overlay quando criado
  function moveInventoryToOverlay() {
    const overlay = document.querySelector('.hud-section-1 .hud-inventory-overlay');
    const inventoryWrapper = document.querySelector('body > .fast-inventory-wrapper, .hud-inventory-slot > .fast-inventory-wrapper');

    if (overlay && inventoryWrapper && !overlay.querySelector('.fast-inventory-wrapper')) {
      // Clonar para não perder event listeners do sistema original
      const clonedWrapper = inventoryWrapper.cloneNode(true);
      clonedWrapper.style.cssText = ''; // Limpar estilos inline
      clonedWrapper.classList.add('overlay-inventory');

      // Remover posicionamento fixo
      clonedWrapper.style.position = 'relative';
      clonedWrapper.style.bottom = 'auto';
      clonedWrapper.style.left = 'auto';

      overlay.appendChild(clonedWrapper);
      console.log('[HUD] Inventário clonado para overlay do player icon');

      // Reattach event listeners nos cards clonados
      setupClonedInventoryListeners(clonedWrapper);
    }
  }

  // Configurar event listeners para o inventário clonado no overlay
  function setupClonedInventoryListeners(wrapper) {
    const cards = wrapper.querySelectorAll('.inventory-card');
    const infoPanels = wrapper.querySelectorAll('.fast-inventory-info-content');

    cards.forEach(card => {
      const cardClass = [...card.classList].find(c => c.startsWith('card'));
      const slotNumber = card.dataset.slotNumber;
      const isDisabled = card.classList.contains('disabled');

      // Hover para mostrar info panel
      card.addEventListener('mouseenter', () => {
        infoPanels.forEach(p => p.classList.remove('visible'));
        const targetPanel = wrapper.querySelector(`.info-${cardClass}`);
        if (targetPanel) {
          targetPanel.classList.add('visible');
        }
      });

      card.addEventListener('mouseleave', () => {
        setTimeout(() => {
          const hoveredCard = wrapper.querySelector('.inventory-card:hover');
          if (!hoveredCard) {
            infoPanels.forEach(p => p.classList.remove('visible'));
          }
        }, 100);
      });

      // Click para usar item (apenas se não está desabilitado)
      if (!isDisabled && slotNumber) {
        card.addEventListener('click', async (e) => {
          e.stopPropagation();

          // Usar a função do fast battle mode se disponível
          if (window.fastBattle && window.fastBattle.useInventoryItem) {
            window.fastBattle.useInventoryItem(parseInt(slotNumber));
          } else {
            // Fallback: chamar API diretamente
            try {
              const response = await fetch(`/gamification/use_potion/${slotNumber}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' }
              });
              const data = await response.json();
              if (data.success) {
                console.log('[HUD] Poção usada via overlay:', data.message);
                // Atualizar HUD
                if (typeof window.updateHudHP === 'function' && data.hp !== undefined) {
                  window.updateHudHP(data.hp, data.max_hp, data.barrier || 0);
                }
                if (typeof window.updateHudEnergy === 'function' && data.energy !== undefined) {
                  window.updateHudEnergy(data.energy, data.max_energy || 10);
                }
                // Recriar overlay inventory após uso
                setTimeout(() => {
                  const existingClone = overlay.querySelector('.fast-inventory-wrapper');
                  if (existingClone) existingClone.remove();
                  moveInventoryToOverlay();
                }, 500);
              }
            } catch (error) {
              console.error('[HUD] Erro ao usar poção via overlay:', error);
            }
          }
        });
      }
    });
  }

  // Setup inicial
  setTimeout(setupInventoryOverlay, 500);

  // Observer para mover inventário quando for criado
  const inventoryObserver = new MutationObserver(function(mutations) {
    mutations.forEach(function(mutation) {
      mutation.addedNodes.forEach(function(node) {
        if (node.nodeType === 1 && node.classList && node.classList.contains('fast-inventory-wrapper')) {
          setTimeout(moveInventoryToOverlay, 100);
        }
      });
    });
  });
  inventoryObserver.observe(document.body, { childList: true, subtree: true });

  // Tentar mover inventário existente
  setTimeout(moveInventoryToOverlay, 1000);
  setTimeout(moveInventoryToOverlay, 2000);

  // Expor função global para atualizar overlay quando inventário muda
  window.refreshInventoryOverlay = function() {
    const overlay = document.querySelector('.hud-section-1 .hud-inventory-overlay');
    if (overlay) {
      const existingClone = overlay.querySelector('.fast-inventory-wrapper');
      if (existingClone) existingClone.remove();
      setTimeout(moveInventoryToOverlay, 100);
    }
  };

  // Observer para detectar quando o inventário original é recriado
  const inventoryRefreshObserver = new MutationObserver(function(mutations) {
    mutations.forEach(function(mutation) {
      if (mutation.type === 'childList') {
        // Verificar se um fast-inventory-wrapper foi adicionado ou modificado
        const hasInventoryChange = [...mutation.addedNodes].some(node =>
          node.nodeType === 1 && (
            node.classList?.contains('fast-inventory-wrapper') ||
            node.querySelector?.('.fast-inventory-wrapper')
          )
        );
        if (hasInventoryChange) {
          setTimeout(() => {
            if (window.refreshInventoryOverlay) {
              window.refreshInventoryOverlay();
            }
          }, 200);
        }
      }
    });
  });

  // Observar mudanças no slot de inventário e no body
  const inventorySlot = document.getElementById('hud-inventory-slot');
  if (inventorySlot) {
    inventoryRefreshObserver.observe(inventorySlot, { childList: true, subtree: true });
  }
  inventoryRefreshObserver.observe(document.body, { childList: true });

  // ========================================
  // FUNÇÕES DE ATUALIZAÇÃO DO HUD INFERIOR
  // ========================================

  // Atualizar HP com percentual correto
  window.updateHudHP = function(current, max, barrier) {
    const hpFill = document.getElementById('hud-hp-fill');
    const barrierFill = document.getElementById('hud-barrier-fill');
    const hpText = document.getElementById('hud-hp-text');
    const hpBarContainer = document.getElementById('hud-hp-bar-container');
    const barrierDisplay = document.getElementById('hud-barrier-display');
    const barrierValue = document.getElementById('hud-barrier-value');

    if (hpFill && hpText) {
      const percent = Math.max(0, Math.min(100, (current / max) * 100));
      hpFill.style.width = percent + '%';
      hpText.textContent = Math.round(current) + '/' + Math.round(max);

      if (percent <= 25) {
        hpFill.classList.add('critical');
      } else {
        hpFill.classList.remove('critical');
      }
    }

    // Atualizar barreira
    if (barrier && barrier > 0) {
      // Mostrar visual de barreira
      if (hpBarContainer) {
        hpBarContainer.classList.add('has-barrier');
      }
      if (barrierFill) {
        const barrierPercent = Math.min(100, (barrier / max) * 100);
        barrierFill.style.width = barrierPercent + '%';
      }
      if (barrierDisplay) {
        barrierDisplay.style.display = 'flex';
      }
      if (barrierValue) {
        barrierValue.textContent = Math.round(barrier);
      }
    } else {
      // Esconder barreira
      if (hpBarContainer) {
        hpBarContainer.classList.remove('has-barrier');
      }
      if (barrierFill) {
        barrierFill.style.width = '0%';
      }
      if (barrierDisplay) {
        barrierDisplay.style.display = 'none';
      }
    }
  };

  // Guardar último valor de energia para detectar mudanças
  let lastEnergyValue = null;

  // Atualizar Energia com efeito visual e animação
  window.updateHudEnergy = function(current, max) {
    const energyText = document.getElementById('hud-energy-text');
    const energyIndicator = document.getElementById('hud-energy-indicator');

    if (energyText) {
      const oldValue = parseInt(energyText.textContent.split('/')[0]) || 0;
      energyText.textContent = current + '/' + max;

      // Animar se o valor mudou
      if (lastEnergyValue !== null && lastEnergyValue !== current && energyIndicator) {
        energyIndicator.classList.remove('energy-changed');
        void energyIndicator.offsetWidth; // Force reflow
        energyIndicator.classList.add('energy-changed');

        setTimeout(() => {
          energyIndicator.classList.remove('energy-changed');
        }, 500);
      }
      lastEnergyValue = current;
    }

    if (energyIndicator) {
      const percent = (current / max) * 100;
      if (percent >= 70) {
        energyIndicator.setAttribute('data-energy-percent', 'high');
      } else if (percent >= 30) {
        energyIndicator.setAttribute('data-energy-percent', 'medium');
      } else {
        energyIndicator.setAttribute('data-energy-percent', 'low');
      }
    }
  };

  // Atualizar Buffs do jogador na batalha
  window.updateHudBuffs = function(buffs) {
    const container = document.getElementById('hud-buffs-container');
    if (!container) return;

    container.innerHTML = '';
    if (!buffs || buffs.length === 0) return;

    buffs.forEach(function(buff) {
      const item = document.createElement('div');
      item.className = 'hud-buff-item ' + (buff.isDebuff ? 'debuff' : 'buff');
      item.title = buff.name + (buff.value ? ': ' + buff.value : '');
      item.innerHTML =
        '<img src="/static/game.data/buffs/' + (buff.icon || 'default_buff.png') + '" alt="' + buff.name + '">' +
        (buff.duration ? '<span class="hud-buff-duration">' + buff.duration + '</span>' : '');
      container.appendChild(item);
    });
  };

  // ========================================
  // FUNÇÕES DE ANIMAÇÃO DE CURRENCIES
  // ========================================

  // Tocar som de currency aumentando
  function playCurrencyUpSound() {
    try {
      const audio = new Audio("/static/game.data/sounds/currency-up.mp3");
      audio.volume = 0.6;
      audio.play().catch(err => {
        console.warn("Som não pôde ser reproduzido:", err);
      });
    } catch (e) {
      console.error("Erro ao tocar som:", e);
    }
  }

  // Marcar elemento como alterado (animação CSS)
  function markChanged(el) {
    if (!el) return;
    el.classList.remove('changed');
    void el.offsetWidth; // force reflow
    el.classList.add('changed');
  }

  // Anima o número subindo, de 'fromVal' até 'toVal'
  function animateCounter(el, fromVal, toVal, duration = 1200) {
    if (!el) return;
    if (el.dataset.animating === '1') return;
    el.dataset.animating = '1';

    const start = performance.now();
    const from = Number(fromVal) || 0;
    const to = Number(toVal) || 0;
    const dur = Math.max(500, duration * Math.min(1, Math.abs(to - from) / 50));

    function step(now) {
      const t = Math.min(1, (now - start) / dur);
      const e = 1 - Math.pow(1 - t, 3); // easeOutCubic
      const curr = Math.round(from + (to - from) * e);
      el.textContent = curr;
      if (t < 1) {
        requestAnimationFrame(step);
      } else {
        el.textContent = to;
        delete el.dataset.animating;
      }
    }
    requestAnimationFrame(step);
  }

  // Criar partículas sparkle ao redor do elemento
  function spawnSparkles(valueEl, count = 8) {
    const item = valueEl.closest('.currency-item');
    if (!item) return;

    const base = item.getBoundingClientRect();
    const rect = valueEl.getBoundingClientRect();

    for (let i = 0; i < count; i++) {
      const s = document.createElement('span');
      s.className = 'sparkle';
      s.textContent = '✦';
      s.style.left = (rect.left - base.left + rect.width / 2) + 'px';
      s.style.top = (rect.top - base.top + rect.height / 2) + 'px';
      item.appendChild(s);

      const angle = Math.random() * Math.PI * 2;
      const dist = 15 + Math.random() * 20;
      const dx = Math.cos(angle) * dist;
      const dy = Math.sin(angle) * dist;

      s.animate(
        [
          { transform: 'translate(0,0) scale(1)', opacity: 1 },
          { transform: `translate(${dx}px, ${dy}px) scale(.9)`, opacity: 0 }
        ],
        { duration: 520 + Math.random() * 240, easing: 'cubic-bezier(.2,.6,.2,1)' }
      ).onfinish = () => s.remove();
    }
  }

  // Sobrescrever updateCurrencyDisplay para incluir animações
  const originalUpdateCurrency = window.updateCurrencyDisplay;

  window.updateCurrencyDisplay = async function() {
    try {
      // Capturar valores ANTES
      const crystalsEl = document.getElementById('crystals-value');
      const goldEl = document.getElementById('gold-value');
      const hourglassesEl = document.getElementById('hourglasses-value');

      const oldCrystals = crystalsEl ? parseInt(crystalsEl.textContent) || 0 : 0;
      const oldGold = goldEl ? parseInt(goldEl.textContent) || 0 : 0;
      const oldHourglasses = hourglassesEl ? parseInt(hourglassesEl.textContent) || 0 : 0;

      const response = await fetch('/gamification/get_player_currencies');
      const data = await response.json();

      if (data.success) {
        let playedSound = false;

        // Cristais
        if (crystalsEl && data.crystals !== undefined) {
          const newVal = parseInt(data.crystals) || 0;
          if (newVal > oldCrystals) {
            markChanged(crystalsEl);
            animateCounter(crystalsEl, oldCrystals, newVal);
            spawnSparkles(crystalsEl, 8);
            if (!playedSound) { playCurrencyUpSound(); playedSound = true; }
          } else if (newVal !== oldCrystals) {
            crystalsEl.textContent = newVal;
            markChanged(crystalsEl);
          } else {
            crystalsEl.textContent = newVal;
          }
        }

        // Ouro
        if (goldEl && data.gold !== undefined) {
          const newVal = parseInt(data.gold) || 0;
          if (newVal > oldGold) {
            markChanged(goldEl);
            animateCounter(goldEl, oldGold, newVal);
            spawnSparkles(goldEl, 8);
            if (!playedSound) { playCurrencyUpSound(); playedSound = true; }
          } else if (newVal !== oldGold) {
            goldEl.textContent = newVal;
            markChanged(goldEl);
          } else {
            goldEl.textContent = newVal;
          }
        }

        // Ampulhetas
        if (hourglassesEl && data.hourglasses !== undefined) {
          const newVal = parseInt(data.hourglasses) || 0;
          if (newVal > oldHourglasses) {
            markChanged(hourglassesEl);
            animateCounter(hourglassesEl, oldHourglasses, newVal);
            spawnSparkles(hourglassesEl, 8);
            if (!playedSound) { playCurrencyUpSound(); playedSound = true; }
          } else if (newVal !== oldHourglasses) {
            hourglassesEl.textContent = newVal;
            markChanged(hourglassesEl);
          } else {
            hourglassesEl.textContent = newVal;
          }
        }
      }
    } catch (error) {
      console.error('[HUD] Erro ao atualizar currencies:', error);
    }
  };

  // ========================================
  // ADICIONAR TOOLTIPS ÀS CURRENCIES
  // ========================================

  function addCurrencyTooltips() {
    const tooltips = {
      'crystals-value': {
        name: 'Cristais de Memória',
        desc: 'Material utilizado para obter melhorias para todas as runs.'
      },
      'gold-value': {
        name: 'Ouro',
        desc: 'Moeda utilizada para comprar itens na loja nesta run.'
      },
      'hourglasses-value': {
        name: 'Ampulhetas Eternas',
        desc: 'Objeto utilizado para manipular o tempo da Eternidade para possibilitar novas opções de escolhas.'
      }
    };

    Object.keys(tooltips).forEach(id => {
      const element = document.getElementById(id);
      if (element) {
        const parent = element.closest('.currency-item');
        if (parent && !parent.querySelector('.currency-tooltip')) {
          parent.style.position = 'relative';
          parent.classList.add('has-tooltip');

          // Estrutura igual às relíquias
          const tooltip = document.createElement('div');
          tooltip.className = 'currency-tooltip';
          tooltip.innerHTML = `
            <div class="currency-tooltip-name">${tooltips[id].name}</div>
            <div class="currency-tooltip-desc">${tooltips[id].desc}</div>
          `;
          parent.appendChild(tooltip);
        }
      }
    });
  }

  // Adicionar tooltips após elementos serem movidos
  setTimeout(addCurrencyTooltips, 600);
  setTimeout(addCurrencyTooltips, 1500);

})();
</script>
