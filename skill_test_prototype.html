<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skill Test Prototype - Vlad Power Attack</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            width: 100%;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #e94560;
            text-shadow: 0 0 10px rgba(233, 69, 96, 0.5);
        }

        .skill-test-wrapper {
            background: rgba(15, 15, 35, 0.8);
            border: 2px solid #e94560;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 0 20px rgba(233, 69, 96, 0.3);
        }

        .power-bar-container {
            position: relative;
            margin-bottom: 30px;
        }

        .power-bar {
            height: 35px;
            position: relative;
            background: linear-gradient(to right,
                #4a0000 0%,      /* Miss - vermelho muito escuro */
                #6b1111 10%,     /* Fraco início */
                #8b2222 30%,     /* Fraco */
                #994d33 40%,     /* Abaixo início */
                #664d33 50%,     /* Abaixo */
                #4d4d4d 60%,     /* Normal - cinza escuro */
                #3d5d3d 70%,     /* Bom - verde escuro */
                #2d4d6d 80%,     /* Ótimo - azul escuro */
                #4d3d6d 90%,     /* Perfeito início - roxo escuro */
                #5d2d7d 100%     /* Perfeito - roxo mais saturado */
            );
            border-radius: 8px;
            border: 2px solid rgba(255, 255, 255, 0.15);
            cursor: pointer;
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.5);
        }

        .marker {
            position: absolute;
            top: -18px;
            width: 0;
            height: 0;
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-top: 18px solid #e94560;
            filter: drop-shadow(0 0 8px #e94560);
            transition: left 0.05s linear;
            z-index: 10;
            pointer-events: none;
        }

        .instructions {
            text-align: center;
            margin-bottom: 20px;
            font-size: 18px;
            color: #ffd700;
        }

        .instructions.inactive {
            color: #666;
        }

        .result-display {
            min-height: 100px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
            text-align: center;
        }

        .result-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .result-details {
            font-size: 16px;
            opacity: 0.8;
        }

        .result-miss { color: #ff1744; }
        .result-negative { color: #ff6f00; }
        .result-normal { color: #9e9e9e; }
        .result-positive { color: #00e676; }
        .result-perfect { color: #e040fb; }


        button {
            background: #e94560;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 20px;
            width: 100%;
            transition: all 0.3s;
        }

        button:hover {
            background: #ff5770;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(233, 69, 96, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background: #666;
            cursor: not-allowed;
            transform: none;
        }

        .stats {
            margin-top: 20px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .stat-box {
            background: rgba(0, 0, 0, 0.4);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #e94560;
        }

        .stat-label {
            font-size: 12px;
            opacity: 0.7;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚔️ SKILL TEST - VLAD POWER ATTACK ⚔️</h1>

        <div class="skill-test-wrapper">
            <div class="instructions" id="instructions">
                Pressione ESPAÇO, ENTER ou CLIQUE para ativar!
            </div>

            <div class="power-bar-container">
                <div class="marker" id="marker"></div>
                <div class="power-bar" id="powerBar"></div>
            </div>

            <div class="result-display" id="resultDisplay">
                <div class="result-title">Aguardando ativação...</div>
                <div class="result-details">O marcador está se movendo. Escolha o momento certo!</div>
            </div>

            <button onclick="resetTest()" id="resetBtn">🔄 Resetar Teste</button>

            <div class="stats">
                <div class="stat-box">
                    <div class="stat-value" id="totalTests">0</div>
                    <div class="stat-label">Total de Testes</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="avgValue">0.0</div>
                    <div class="stat-label">Média de Valores</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="perfectCount">0</div>
                    <div class="stat-label">Acertos (7+)</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Estado do jogo
        let isActive = true;
        let animationStartTime = null;
        let currentValue = 0;
        let stats = {
            total: 0,
            sum: 0,
            perfect: 0
        };

        // Constantes
        const ANIMATION_DURATION = 1000; // 1 segundo para ciclo completo
        const SEGMENTS = 10;

        // Função de easing para aceleração FORTE (0 -> 10)
        // Usa potência cúbica para acelerar muito mais perto do 10
        function easeInCubic(t) {
            return t * t * t;
        }

        // Função de easing para desaceleração (10 -> 0)
        function easeOutCubic(t) {
            return 1 - Math.pow(1 - t, 3);
        }

        // Calcula o valor atual baseado no tempo
        function calculateCurrentValue(timestamp) {
            if (!animationStartTime) animationStartTime = timestamp;

            const elapsed = (timestamp - animationStartTime) % ANIMATION_DURATION;
            const progress = elapsed / ANIMATION_DURATION;

            let value;
            if (progress < 0.5) {
                // Primeira metade: 0 -> 10 (acelerando MUITO - cúbico)
                const t = progress * 2; // normaliza para 0-1
                value = easeInCubic(t) * 10;
            } else {
                // Segunda metade: 10 -> 0 (desacelerando - cúbico)
                const t = (progress - 0.5) * 2; // normaliza para 0-1
                value = 10 - (easeOutCubic(t) * 10);
            }

            return value;
        }

        // Atualiza a posição do marcador
        function updateMarker(value) {
            const marker = document.getElementById('marker');
            const powerBar = document.getElementById('powerBar');
            const barWidth = powerBar.offsetWidth;

            // Calcula a posição (0-10 mapeado para a largura da barra)
            const percentage = value / 10;
            const position = (barWidth * percentage) - 12; // -12 para centralizar o triângulo menor

            marker.style.left = `${position}px`;

            return Math.ceil(value);
        }

        // Loop de animação
        function animate(timestamp) {
            if (isActive) {
                currentValue = calculateCurrentValue(timestamp);
                updateMarker(currentValue);
                requestAnimationFrame(animate);
            }
        }

        // Ativa o skill test
        function activateSkillTest() {
            if (!isActive) return;

            isActive = false;
            const value = Math.ceil(currentValue);

            // Atualiza instruções
            document.getElementById('instructions').textContent = 'Teste concluído!';
            document.getElementById('instructions').classList.add('inactive');

            // Calcula resultado
            const result = calculateResult(value);
            displayResult(value, result);

            // Atualiza estatísticas
            updateStats(value);
        }

        // Calcula o resultado baseado no valor
        function calculateResult(value) {
            if (value === 1) {
                return {
                    damage: 0,
                    modifier: 0,
                    barrier: 0,
                    text: 'MISS!',
                    description: 'O ataque falhou completamente!',
                    class: 'result-miss'
                };
            } else if (value >= 2 && value <= 4) {
                return {
                    damage: -10,
                    modifier: 0.9,
                    barrier: 0,
                    text: 'FRACO',
                    description: '-10% de dano',
                    class: 'result-negative'
                };
            } else if (value >= 5 && value <= 6) {
                return {
                    damage: -5,
                    modifier: 0.95,
                    barrier: 0,
                    text: 'ABAIXO',
                    description: '-5% de dano',
                    class: 'result-negative'
                };
            } else if (value === 7) {
                return {
                    damage: 0,
                    modifier: 1.0,
                    barrier: 0,
                    text: 'NORMAL',
                    description: 'Dano normal, sem modificadores',
                    class: 'result-normal'
                };
            } else if (value === 8) {
                return {
                    damage: 5,
                    modifier: 1.05,
                    barrier: 0,
                    text: 'BOM!',
                    description: '+5% de dano',
                    class: 'result-positive'
                };
            } else if (value === 9) {
                return {
                    damage: 10,
                    modifier: 1.10,
                    barrier: 2,
                    text: 'ÓTIMO!',
                    description: '+10% de dano + 2 de barreira',
                    class: 'result-positive'
                };
            } else if (value === 10) {
                return {
                    damage: 10,
                    modifier: 1.10,
                    barrier: 5,
                    text: 'PERFEITO!',
                    description: '+10% de dano + 5 de barreira',
                    class: 'result-perfect'
                };
            }
        }

        // Exibe o resultado
        function displayResult(value, result) {
            const display = document.getElementById('resultDisplay');

            let html = `
                <div class="result-title ${result.class}">
                    Valor ${value}: ${result.text}
                </div>
                <div class="result-details">
                    ${result.description}
                    ${result.barrier > 0 ? `<br><strong>🛡️ Barreira: +${result.barrier}</strong>` : ''}
                </div>
            `;

            display.innerHTML = html;
        }

        // Atualiza estatísticas
        function updateStats(value) {
            stats.total++;
            stats.sum += value;
            if (value >= 7) stats.perfect++;

            document.getElementById('totalTests').textContent = stats.total;
            document.getElementById('avgValue').textContent = (stats.sum / stats.total).toFixed(1);
            document.getElementById('perfectCount').textContent = stats.perfect;
        }

        // Reseta o teste
        function resetTest() {
            isActive = true;
            animationStartTime = null;
            currentValue = 0;

            document.getElementById('instructions').textContent = 'Pressione ESPAÇO, ENTER ou CLIQUE para ativar!';
            document.getElementById('instructions').classList.remove('inactive');

            document.getElementById('resultDisplay').innerHTML = `
                <div class="result-title">Aguardando ativação...</div>
                <div class="result-details">O marcador está se movendo. Escolha o momento certo!</div>
            `;

            requestAnimationFrame(animate);
        }

        // Event listeners
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'Enter') {
                e.preventDefault();
                activateSkillTest();
            }
        });

        document.getElementById('powerBar').addEventListener('click', () => {
            activateSkillTest();
        });

        // Inicia a animação
        requestAnimationFrame(animate);
    </script>
</body>
</html>
