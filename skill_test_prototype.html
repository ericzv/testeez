<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skill Test Prototype - Vlad Power Attack</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            width: 100%;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #e94560;
            text-shadow: 0 0 10px rgba(233, 69, 96, 0.5);
        }

        .skill-test-wrapper {
            background: rgba(15, 15, 35, 0.8);
            border: 2px solid #e94560;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 0 20px rgba(233, 69, 96, 0.3);
        }

        .power-bar-container {
            position: relative;
            margin-bottom: 30px;
        }

        .power-bar {
            display: flex;
            gap: 6px;
            height: 35px;
            cursor: pointer;
        }

        .light-bar {
            flex: 1;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.1s;
            position: relative;
            overflow: hidden;
        }

        .light-bar::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: inherit;
            opacity: 0;
            transition: opacity 0.1s;
        }

        /* Cores das barrinhas baseadas na posição */
        .light-bar[data-value="1"] { --bar-color: #6b0000; } /* Miss */
        .light-bar[data-value="2"] { --bar-color: #7b1111; } /* Fraco */
        .light-bar[data-value="3"] { --bar-color: #8b2222; }
        .light-bar[data-value="4"] { --bar-color: #9b3333; }
        .light-bar[data-value="5"] { --bar-color: #8b5533; } /* Abaixo */
        .light-bar[data-value="6"] { --bar-color: #7b6633; }
        .light-bar[data-value="7"] { --bar-color: #5d5d5d; } /* Normal */
        .light-bar[data-value="8"] { --bar-color: #3d6d3d; } /* Bom */
        .light-bar[data-value="9"] { --bar-color: #2d5d7d; } /* Ótimo */
        .light-bar[data-value="10"] { --bar-color: #5d2d8d; } /* Perfeito */

        .light-bar.lit {
            background: var(--bar-color);
            border-color: var(--bar-color);
            box-shadow: 0 0 10px var(--bar-color), inset 0 0 10px rgba(255, 255, 255, 0.3);
        }

        .light-bar.lit::before {
            opacity: 1;
        }

        .instructions {
            text-align: center;
            margin-bottom: 20px;
            font-size: 18px;
            color: #ffd700;
        }

        .instructions.inactive {
            color: #666;
        }

        .difficulty-indicator {
            text-align: center;
            margin-bottom: 15px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            font-size: 14px;
        }

        .difficulty-level {
            font-weight: bold;
            font-size: 18px;
        }

        .difficulty-1 { color: #4caf50; } /* Verde - Fácil */
        .difficulty-2 { color: #ff9800; } /* Laranja - Médio */
        .difficulty-3 { color: #f44336; } /* Vermelho - Difícil */
        .difficulty-4 { color: #9c27b0; } /* Roxo - Muito Difícil */

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
        }

        .button-group button {
            margin: 0;
        }

        .result-display {
            min-height: 100px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
            text-align: center;
        }

        .result-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .result-details {
            font-size: 16px;
            opacity: 0.8;
        }

        .result-miss { color: #ff1744; }
        .result-negative { color: #ff6f00; }
        .result-normal { color: #9e9e9e; }
        .result-positive { color: #00e676; }
        .result-perfect { color: #e040fb; }


        button {
            background: #e94560;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 20px;
            width: 100%;
            transition: all 0.3s;
        }

        button:hover {
            background: #ff5770;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(233, 69, 96, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background: #666;
            cursor: not-allowed;
            transform: none;
        }

        .stats {
            margin-top: 20px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .stat-box {
            background: rgba(0, 0, 0, 0.4);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #e94560;
        }

        .stat-label {
            font-size: 12px;
            opacity: 0.7;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚔️ SKILL TEST - VLAD POWER ATTACK ⚔️</h1>

        <div class="skill-test-wrapper">
            <div class="difficulty-indicator">
                <div>Usos neste turno: <span id="usesThisTurn">0</span></div>
                <div class="difficulty-level" id="difficultyLevel">Dificuldade: Normal</div>
            </div>

            <div class="instructions" id="instructions">
                Pressione ESPAÇO, ENTER ou CLIQUE para ativar!
            </div>

            <div class="power-bar-container">
                <div class="power-bar" id="powerBar">
                    <div class="light-bar" data-value="1"></div>
                    <div class="light-bar" data-value="2"></div>
                    <div class="light-bar" data-value="3"></div>
                    <div class="light-bar" data-value="4"></div>
                    <div class="light-bar" data-value="5"></div>
                    <div class="light-bar" data-value="6"></div>
                    <div class="light-bar" data-value="7"></div>
                    <div class="light-bar" data-value="8"></div>
                    <div class="light-bar" data-value="9"></div>
                    <div class="light-bar" data-value="10"></div>
                </div>
            </div>

            <div class="result-display" id="resultDisplay">
                <div class="result-title">Aguardando ativação...</div>
                <div class="result-details">O marcador está se movendo. Escolha o momento certo!</div>
            </div>

            <div class="button-group">
                <button onclick="resetTest()" id="resetBtn">🔄 Resetar Teste</button>
                <button onclick="nextTurn()" id="nextTurnBtn">⏭️ Próximo Turno</button>
            </div>

            <div class="stats">
                <div class="stat-box">
                    <div class="stat-value" id="totalTests">0</div>
                    <div class="stat-label">Total de Testes</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="avgValue">0.0</div>
                    <div class="stat-label">Média de Valores</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="perfectCount">0</div>
                    <div class="stat-label">Acertos (7+)</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // SISTEMA DE ÁUDIO - Web Audio API
        // ============================================
        let audioContext = null;
        let audioEnabled = false;

        // Inicializa Web Audio API (só após primeiro clique do usuário)
        function initAudio() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                audioEnabled = true;
                console.log('🔊 Sistema de áudio inicializado');
            }
        }

        // Toca um beep sintetizado com pitch variável
        function playBeep(barValue) {
            if (!audioEnabled || !audioContext) return;

            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();

            // Conecta oscillator -> gain -> output
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);

            // Frequências crescentes (220 Hz = A3 até ~880 Hz = A5)
            // Bar 1 = 220 Hz, Bar 10 = 880 Hz (2 oitavas)
            const baseFreq = 220; // A3
            const frequency = baseFreq + (barValue - 1) * 73.33; // Escala linear
            oscillator.frequency.value = frequency;

            // Tipo de onda (sine = suave, square = 8-bit, triangle = meio termo)
            oscillator.type = 'sine';

            // Envelope: Volume começa em 0.3, cai rapidamente para 0
            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.05);

            // Toca por 50ms
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.05);
        }

        // ============================================
        // ESTADO DO JOGO
        // ============================================
        let isActive = true;
        let animationStartTime = null;
        let currentValue = 0;
        let lastPlayedBar = 0; // Última barra que tocou som
        let usesThisTurn = 0; // Contador de usos no turno atual
        let currentDifficulty = 1; // 1 = normal, 2 = médio, 3 = difícil, 4+ = muito difícil
        let stats = {
            total: 0,
            sum: 0,
            perfect: 0
        };

        // Constantes
        const ANIMATION_DURATION = 1000; // 1 segundo para ciclo completo
        const SEGMENTS = 10;

        // ============================================
        // FUNÇÕES DE EASING COM DIFICULDADE AJUSTÁVEL
        // ============================================

        // Aceleração com dificuldade progressiva
        // difficulty 1 = cúbico (x³), 2 = quártico (x⁴), 3 = quíntico (x⁵), etc
        function easeInScaled(t, difficulty) {
            const exponent = 2 + difficulty; // 3, 4, 5, 6...
            return Math.pow(t, exponent);
        }

        // Desaceleração com dificuldade progressiva
        function easeOutScaled(t, difficulty) {
            const exponent = 2 + difficulty;
            return 1 - Math.pow(1 - t, exponent);
        }

        // Calcula o valor atual baseado no tempo e dificuldade
        function calculateCurrentValue(timestamp) {
            if (!animationStartTime) animationStartTime = timestamp;

            const elapsed = (timestamp - animationStartTime) % ANIMATION_DURATION;
            const progress = elapsed / ANIMATION_DURATION;

            let value;
            if (progress < 0.5) {
                // Primeira metade: 0 -> 10 (acelerando - dificuldade afeta velocidade)
                const t = progress * 2; // normaliza para 0-1
                value = easeInScaled(t, currentDifficulty) * 10;
            } else {
                // Segunda metade: 10 -> 0 (desacelerando - dificuldade afeta velocidade)
                const t = (progress - 0.5) * 2; // normaliza para 0-1
                value = 10 - (easeOutScaled(t, currentDifficulty) * 10);
            }

            return value;
        }

        // Atualiza as barrinhas de luz
        function updateLightBars(value) {
            const lightBars = document.querySelectorAll('.light-bar');
            const activeLevel = Math.ceil(value);

            // Toca som quando mudar de barra
            if (activeLevel !== lastPlayedBar && activeLevel > 0 && activeLevel <= 10) {
                playBeep(activeLevel);
                lastPlayedBar = activeLevel;
            }

            lightBars.forEach((bar, idx) => {
                const barValue = idx + 1;
                // Acende todas as barras até o nível atual
                if (barValue <= activeLevel) {
                    bar.classList.add('lit');
                } else {
                    bar.classList.remove('lit');
                }
            });

            return activeLevel;
        }

        // Loop de animação
        function animate(timestamp) {
            if (isActive) {
                currentValue = calculateCurrentValue(timestamp);
                updateLightBars(currentValue);
                requestAnimationFrame(animate);
            }
        }

        // Ativa o skill test
        function activateSkillTest() {
            if (!isActive) return;

            // Inicializa áudio no primeiro clique (navegadores exigem interação do usuário)
            initAudio();

            isActive = false;
            const value = Math.ceil(currentValue);

            // Incrementa usos no turno e calcula nova dificuldade
            usesThisTurn++;
            currentDifficulty = usesThisTurn; // 1ª vez = 1, 2ª vez = 2, 3ª vez = 3...
            updateDifficultyDisplay();

            // Atualiza instruções
            document.getElementById('instructions').textContent = 'Teste concluído!';
            document.getElementById('instructions').classList.add('inactive');

            // Calcula resultado
            const result = calculateResult(value);
            displayResult(value, result);

            // Atualiza estatísticas
            updateStats(value);
        }

        // Atualiza o display de dificuldade
        function updateDifficultyDisplay() {
            document.getElementById('usesThisTurn').textContent = usesThisTurn;

            const difficultyEl = document.getElementById('difficultyLevel');
            let difficultyText = '';
            let difficultyClass = '';

            if (currentDifficulty === 1) {
                difficultyText = 'Dificuldade: Normal';
                difficultyClass = 'difficulty-1';
            } else if (currentDifficulty === 2) {
                difficultyText = 'Dificuldade: Médio';
                difficultyClass = 'difficulty-2';
            } else if (currentDifficulty === 3) {
                difficultyText = 'Dificuldade: Difícil';
                difficultyClass = 'difficulty-3';
            } else {
                difficultyText = 'Dificuldade: Muito Difícil';
                difficultyClass = 'difficulty-4';
            }

            difficultyEl.textContent = difficultyText;
            difficultyEl.className = 'difficulty-level ' + difficultyClass;
        }

        // Avança para o próximo turno (reseta contador de usos)
        function nextTurn() {
            usesThisTurn = 0;
            currentDifficulty = 1;
            updateDifficultyDisplay();

            // Auto-reset se não estiver ativo
            if (!isActive) {
                resetTest();
            }
        }

        // Calcula o resultado baseado no valor
        function calculateResult(value) {
            if (value === 1) {
                return {
                    damage: 0,
                    modifier: 0,
                    barrier: 0,
                    text: 'MISS!',
                    description: 'O ataque falhou completamente!',
                    class: 'result-miss'
                };
            } else if (value >= 2 && value <= 4) {
                return {
                    damage: -10,
                    modifier: 0.9,
                    barrier: 0,
                    text: 'FRACO',
                    description: '-10% de dano',
                    class: 'result-negative'
                };
            } else if (value >= 5 && value <= 6) {
                return {
                    damage: -5,
                    modifier: 0.95,
                    barrier: 0,
                    text: 'ABAIXO',
                    description: '-5% de dano',
                    class: 'result-negative'
                };
            } else if (value === 7) {
                return {
                    damage: 0,
                    modifier: 1.0,
                    barrier: 0,
                    text: 'NORMAL',
                    description: 'Dano normal, sem modificadores',
                    class: 'result-normal'
                };
            } else if (value === 8) {
                return {
                    damage: 5,
                    modifier: 1.05,
                    barrier: 0,
                    text: 'BOM!',
                    description: '+5% de dano',
                    class: 'result-positive'
                };
            } else if (value === 9) {
                return {
                    damage: 10,
                    modifier: 1.10,
                    barrier: 2,
                    text: 'ÓTIMO!',
                    description: '+10% de dano + 2 de barreira',
                    class: 'result-positive'
                };
            } else if (value === 10) {
                return {
                    damage: 10,
                    modifier: 1.10,
                    barrier: 5,
                    text: 'PERFEITO!',
                    description: '+10% de dano + 5 de barreira',
                    class: 'result-perfect'
                };
            }
        }

        // Exibe o resultado
        function displayResult(value, result) {
            const display = document.getElementById('resultDisplay');

            let html = `
                <div class="result-title ${result.class}">
                    Valor ${value}: ${result.text}
                </div>
                <div class="result-details">
                    ${result.description}
                    ${result.barrier > 0 ? `<br><strong>🛡️ Barreira: +${result.barrier}</strong>` : ''}
                </div>
            `;

            display.innerHTML = html;
        }

        // Atualiza estatísticas
        function updateStats(value) {
            stats.total++;
            stats.sum += value;
            if (value >= 7) stats.perfect++;

            document.getElementById('totalTests').textContent = stats.total;
            document.getElementById('avgValue').textContent = (stats.sum / stats.total).toFixed(1);
            document.getElementById('perfectCount').textContent = stats.perfect;
        }

        // Reseta o teste (mantém dificuldade do turno atual)
        function resetTest() {
            isActive = true;
            animationStartTime = null;
            currentValue = 0;
            lastPlayedBar = 0; // Reseta tracking de som

            document.getElementById('instructions').textContent = 'Pressione ESPAÇO, ENTER ou CLIQUE para ativar!';
            document.getElementById('instructions').classList.remove('inactive');

            document.getElementById('resultDisplay').innerHTML = `
                <div class="result-title">Aguardando ativação...</div>
                <div class="result-details">O marcador está se movendo. Escolha o momento certo!</div>
            `;

            requestAnimationFrame(animate);
        }

        // Event listeners
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'Enter') {
                e.preventDefault();
                activateSkillTest();
            }
        });

        document.getElementById('powerBar').addEventListener('click', () => {
            activateSkillTest();
        });

        // Inicia a animação
        requestAnimationFrame(animate);
    </script>
</body>
</html>
